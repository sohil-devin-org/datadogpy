name: quick-check

permissions:
  contents: read

on:
  pull_request:
  push:
    branches:
    - master
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  quick:
    name: flake8 + mypy + unit + cassettes + docs (Python 3.12)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

    - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
      with:
        python-version: '3.12'
        cache: pip

    - name: Install
      run: |
        python -m pip install -e . click freezegun mock pytest pytest-vcr python-dateutil vcrpy \
          flake8==7.1.2 mypy==1.14.1 -r doc/requirements.txt

    - name: flake8
      run: flake8 datadog

    - name: mypy
      run: mypy --config-file mypy.ini datadog

    - name: Unit tests
      run: pytest -q tests/unit

    - name: Integration tests (recorded cassettes only)
      run: pytest -q tests/integration -m "not admin_needed" --vcr-record=none

    - name: Sphinx docs build
      run: sphinx-build -b html doc/source doc/_build/html
