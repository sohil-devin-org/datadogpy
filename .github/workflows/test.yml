name: test

permissions:
  contents: read

on:
  push:
    branches:
    - master
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint datadogpy files on Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.9']
    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install tox

    # - name: Run black
    #   run: pre-commit run --all-files --hook-stage=manual black

    - name: Run mypy
      run: tox -e mypy

    - name: Run flake8
      run: tox -e flake8

  run:
    name: Python ${{ matrix.python-version }} on ${{ startsWith(matrix.os, 'macos-') && 'macOS' || startsWith(matrix.os, 'windows-') && 'Windows' || 'Linux' }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04]
        python-version: ['3.9', '3.10', '3.11', '3.12', '3.13', '3.14', 'pypy3.10']
    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
      with:
        python-version: ${{ matrix.python-version }}

    - name: Set TOXENV
      run: |
        version="${{ matrix.python-version }}"
        if [[ "$version" == pypy* ]]; then
          echo "TOXENV=$version" >> $GITHUB_ENV
        else
          echo "TOXENV=py${version//./}" >> $GITHUB_ENV
        fi

    - name: Install tox
      run: pip install tox

    - name: Run unit tests
      run: tox

    - name: Run integration tests on cassettes
      run: tox -e integration -- --vcr-record=none

    - name: Run admin integration tests on cassettes
      run: tox -e integration-admin -- --vcr-record=none
